<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Mebel — Эксклюзивная мебель</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark: #0a0a0a;
            --gold: #d4af37;
            --light: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            line-height: 1.6;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .logo { font-family: 'Playfair Display'; font-size: 24px; color: var(--gold); text-decoration: none; letter-spacing: 2px; }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('images/photo_87.jpg');
            background-size: cover;
            background-position: center;
        }

        .hero-img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid var(--gold); margin-bottom: 20px; object-fit: cover; }

        .hero h1 { font-size: 5rem; margin-bottom: 20px; text-transform: uppercase; }

        .btn {
            padding: 15px 40px;
            border: 1px solid var(--gold);
            color: var(--light);
            text-decoration: none;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn:hover { background: var(--gold); color: var(--dark); }

        .section { padding: 100px 20px; max-width: 1100px; margin: auto; opacity: 0; transform: translateY(50px); transition: 1s; }
        .section.active { opacity: 1; transform: translateY(0); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; }

        .item { background: var(--glass); padding: 20px; border: 1px solid #333; transition: 0.4s; }
        .item:hover { border-color: var(--gold); transform: translateY(-10px); }

        .item-img { width: 100%; height: 250px; margin-bottom: 20px; border: 1px solid var(--gold); }

        footer { text-align: center; padding: 40px; border-top: 1px solid #333; color: #666; }
        footer img { width: 50px; height: 50px; border-radius: 50%; margin-top: 10px; border: 1px solid var(--gold); }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">LA MEBEL</a>
        <div class="nav-links">
            <a href="#about" style="color:white; text-decoration:none; margin-left:20px;">О нас</a>
        </div>
    </nav>

    <header class="hero">
        <img src="images/photo_87.jpg" alt="La Mebel" class="hero-img">
        <h1>Дизайн вне времени</h1>
        <a href="#catalog" class="btn">Выбрать мебель</a>
    </header>

    <section class="section" id="catalog">
        <h2 style="font-family:'Playfair Display'; font-size: 3rem; text-align:center; margin-bottom: 50px;">Коллекция</h2>
        <div class="grid">
            <div class="item">
                <img src="images/photo_87.jpg" alt="Классика" class="item-img">
                <h3>Классика</h3>
            </div>
            <div class="item">
                <img src="images/photo_87.jpg" alt="Модерн" class="item-img">
                <h3>Модерн</h3>
            </div>
            <div class="item">
                <img src="images/photo_87.jpg" alt="Лофт" class="item-img">
                <h3>Лофт</h3>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 LA MEBEL. Искусство в каждой детали.</p>
        <img src="images/photo_87.jpg" alt="Footer Logo">
    </footer>

    <script>
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('active'); });
        }, { threshold: 0.2 });
        document.querySelectorAll('.section').forEach(s => observer.observe(s));
    </script>
</body>
</html>
