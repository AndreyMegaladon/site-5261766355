
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Tech - Магазин Видеокарт</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0b;
            --card-bg: #16161a;
            --accent: #7c4dff;
            --accent-hover: #9e7aff;
            --text: #ffffff;
            --text-muted: #a0a0a5;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(10, 10, 11, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(45deg, var(--accent), #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tools {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .search-container {
            position: relative;
        }

        #search-input {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            color: white;
            width: 250px;
            transition: var(--transition);
        }

        #search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(124, 77, 255, 0.2);
        }

        .cart-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            position: relative;
            font-size: 1.2rem;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--accent);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .hero {
            text-align: center;
            padding: 6rem 5%;
            background: radial-gradient(circle at center, rgba(124, 77, 255, 0.15) 0%, transparent 70%);
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: fadeInDown 0.8s ease;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .catalog {
            padding: 4rem 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 1rem;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .card-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .card-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        .buy-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: auto;
        }

        .buy-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px rgba(124, 77, 255, 0.4);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            width: 90%;
            max-width: 450px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-content h2 {
            margin-bottom: 1.5rem;
        }

        .modal-content input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            right: -400px;
            top: 0;
            width: 350px;
            height: 100%;
            background: var(--card-bg);
            z-index: 1500;
            padding: 2rem;
            transition: 0.4s ease;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.active {
            right: 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            #search-input { width: 150px; }
            .catalog { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">GPU TECH</div>
    <div class="nav-tools">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Поиск видеокарты...">
        </div>
        <button class="cart-btn" onclick="toggleCart()">
            🛒 <span class="cart-count" id="cart-count">0</span>
        </button>
    </div>
</header>

<section class="hero">
    <h1>Новый уровень гейминга</h1>
    <p>Лучшие графические решения для профессионалов и энтузиастов. Доставка по всей вселенной.</p>
</section>

<main class="catalog" id="catalog">
    <!-- JS will populate cards here -->
</main>

<div class="cart-sidebar" id="cart-sidebar">
    <h2>Корзина</h2>
    <div id="cart-items" style="flex: 1; overflow-y: auto; margin: 1.5rem 0;"></div>
    <div id="cart-total" style="font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem;">Итого: 0 ₽</div>
    <button class="buy-btn" onclick="openOrderModal()">Оформить заказ</button>
    <button class="buy-btn" style="background: transparent; margin-top: 10px;" onclick="toggleCart()">Закрыть</button>
</div>

<div class="modal" id="order-modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeOrderModal()">&times;</span>
        <h2>Оформление заказа</h2>
        <form id="order-form">
            <input type="text" placeholder="Ваше имя" required>
            <input type="tel" placeholder="Номер телефона" required>
            <input type="email" placeholder="Email" required>
            <button type="submit" class="buy-btn" style="width: 100%;">Подтвердить покупку</button>
        </form>
    </div>
</div>

<script>
    const products = [
        { id: 1, name: "NVIDIA RTX 4090", price: 210000, img: "https://images.unsplash.com/photo-1671231647413-56832e8d356f?q=80&w=1000&auto=format&fit=crop" },
        { id: 2, name: "NVIDIA RTX 4080", price: 145000, img: "https://images.unsplash.com/photo-1671231647413-56832e8d356f?q=80&w=1000&auto=format&fit=crop" },
        { id: 3, name: "AMD Radeon RX 7900 XTX", price: 120000, img: "https://images.unsplash.com/photo-1647318721473-b3eb278d651f?q=80&w=1000&auto=format&fit=crop" },
        { id: 4, name: "NVIDIA RTX 4070 Ti", price: 95000, img: "https://images.unsplash.com/photo-1671231647413-56832e8d356f?q=80&w=1000&auto=format&fit=crop" },
        { id: 5, name: "AMD Radeon RX 7800 XT", price: 72000, img: "https://images.unsplash.com/photo-1647318721473-b3eb278d651f?q=80&w=1000&auto=format&fit=crop" },
        { id: 6, name: "NVIDIA RTX 3060", price: 35000, img: "https://images.unsplash.com/photo-1671231647413-56832e8d356f?q=80&w=1000&auto=format&fit=crop" }
    ];

    let cart = [];

    function renderCatalog(items) {
        const catalog = document.getElementById('catalog');
        catalog.innerHTML = items.map(product => `
            <div class="card">
                <img src="${product.img}" alt="${product.name}">
                <div class="card-title">${product.name}</div>
                <div class="card-price">${product.price.toLocaleString()} ₽</div>
                <button class="buy-btn" onclick="addToCart(${product.id})">Добавить в корзину</button>
            </div>
        `).join('');
    }

    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        cart.push(product);
        updateCart();
        
        // Маленькая анимация кнопки
        const btn = event.target;
        btn.innerHTML = 'Добавлено! ✓';
        btn.style.background = '#00c853';
        setTimeout(() => {
            btn.innerHTML = 'Добавить в корзину';
            btn.style.background = 'var(--accent)';
        }, 1000);
    }

    function updateCart() {
        const cartCount = document.getElementById('cart-count');
        const cartItems = document.getElementById('cart-items');
        const cartTotal = document.getElementById('cart-total');
        
        cartCount.innerText = cart.length;
        
        cartItems.innerHTML = cart.map((item, index) => `
            <div class="cart-item">
                <span>${item.name}</span>
                <span>${item.price.toLocaleString()} ₽ <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#ff4d4d; cursor:pointer; margin-left:10px;">✕</button></span>
            </div>
        `).join('');

        const total = cart.reduce((sum, item) => sum + item.price, 0);
        cartTotal.innerText = `Итого: ${total.toLocaleString()} ₽`;
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCart();
    }

    function toggleCart() {
        document.getElementById('cart-sidebar').classList.toggle('active');
    }

    function openOrderModal() {
        if (cart.length === 0) {
            alert('Корзина пуста!');
            return;
        }
        document.getElementById('order-modal').style.display = 'flex';
    }

    function closeOrderModal() {
        document.getElementById('order-modal').style.display = 'none';
    }

    // Search functionality
    document.getElementById('search-input').addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(val));
        renderCatalog(filtered);
    });

    // Form submission
    document.getElementById('order-form').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Спасибо за заказ! Наш менеджер свяжется с вами в ближайшее время.');
        cart = [];
        updateCart();
        closeOrderModal();
        toggleCart();
    });

    // Close modal on outside click
    window.onclick = function(event) {
        const modal = document.getElementById('order-modal');
        if (event.target == modal) {
            closeOrderModal();
        }
    }

    // Initial render
    renderCatalog(products);
</script>

</body>
</html>
